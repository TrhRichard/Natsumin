[project]
name = "natsumin"
version = "2.0.0"
description = "Discord bot for Anicord Event Server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "aiosqlite>=0.21.0",
    "parsedatetime>=2.6",
    "py-cord==2.8.0",
    "python-dotenv>=1.1.1",
    "thefuzz>=0.22.1",
]

[tool.ruff]
select = ["E4", "E7", "E9", "F"]
line-length = 150
fix = true
show-fixes = true
target-version = "py312"

[tool.ruff.format]
indent-style = "tab"
skip-magic-trailing-comma = true

[tool.ruff.analyze]
detect-string-imports = true

[tool.ruff.lint]
ignore = ["I001", "N999"]

[dependency-groups]
dev = [
    "ruff>=0.16.0",
]
